name: Typos AI
description: Resolve ambiguous typos found by typos with a small local model
inputs:
  run:
    required: false
    default: "1"
    description: Run typos
  dry:
    required: false
    default: ""
    description: Do not write changes
runs:
  using: composite
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest
    - name: Cache model
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/typos-ai
        key: typos-ai-smollm2-135m-q4km-9e6855bc
    - shell: bash
      run: |
        echo "::group::Install"
        bun i palabra typos.ai -g --no-save
        palabra i typos
        echo "::endgroup::"
    - shell: bash
      run: typos.ai
      env:
        TYPOS_AI_HOME: ${{ runner.temp }}/typos-ai
        TYPOS_AI_RUN: ${{ inputs.run }}
        TYPOS_AI_DRY: ${{ inputs.dry }}
